output:
  answer: 'El Modernisme a Catalunya


    El modernisme va ser un moviment artístic i literari que es va desenvolupar entre
    finals del segle XIX i principis del XX, principalment a Catalunya. Va sorgir
    en un moment d''expansió industrial i de renovació cultural, amb un fort sentiment
    d''identitat catalana. Els artistes modernistes buscaven innovar i allunyar-se
    dels estils tradicionals, inspirant-se en la natura, les formes orgàniques i les
    cultures exòtiques.


    Un tret característic del modernisme és l''ús de línies corbes i asimètriques,
    que donen un aspecte dinàmic i orgànic a les obres. Per exemple, les façanes ondulades
    de la Casa Batlló de Gaudí. Un altre tret important és l''ús de la simbologia
    i els elements decoratius detallats, com les mosaics i les formes florals, que
    es poden veure en obres com el Parc Güell.'
