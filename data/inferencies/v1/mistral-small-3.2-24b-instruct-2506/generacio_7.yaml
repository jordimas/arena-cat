output:
  answer: 'Sant Jordi és una festa que celebra la cultura catalana, i avui en dia
    tenim l''oportunitat de modernitzar-la sense perdre la seva essència. La tradició
    i la innovació no han de ser excloents, sinó que poden complementar-se per arribar
    a més gent.


    En primer lloc, els audiollibres i els còmics digitals fan la cultura més accessible.
    Moltes persones prefereixen escoltar un llibre o llegir una història en format
    digital, i això no vol dir que no valorin la tradició. Al contrari, estàn consumint
    cultura en un format que se''ls fa més còmode.


    En segon lloc, aquestes noves tecnologies permeten arribar a un públic més ampli.
    Els joves, per exemple, poden estar més interessats en un còmic digital que en
    un llibre tradicional. Això no vol dir que deixin de llegir, sinó que estan explorant
    noves maneres de consumir la cultura.


    Per això, proposo que el nostre institut organitzi un concurs de còmics digitals
    sobre la llegenda de Sant Jordi. Així, els alumnes podran combinar la tradició
    amb la creativitat digital, i tots en sortirem guanyant.'
