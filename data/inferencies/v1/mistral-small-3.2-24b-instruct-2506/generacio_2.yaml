output:
  answer: 'Bon dia a tots!


    Avui us vull presentar una tradició molt especial de Catalunya: els castells.
    Els castells són torres humanes que es construeixen per equips, combinant força,
    equilibri, valor i seny. Aquesta frase resumeix els valors dels castells: la força
    és la potència física, l''equilibri és la coordinació, el valor és la valentia
    i el seny és la saviesa i la prudència.


    Per construir un castell, primer es forma la pinya, que és la base humana on tots
    els participants s''agafen i s''equilibren. Damunt la pinya, es forma el tronc,
    que són les persones que es posen en espatlla per crear l''estructura vertical.
    Finalment, l''enxaneta és el més petit que puja al capdamunt i alça la mà per
    fer el castell oficial.


    Els castells són una manifestació de treball en equip, tradició i cultura catalana.
    És una experiència impressionant de veure i, sobretot, de viure!


    Gràcies per la vostra atenció!'
