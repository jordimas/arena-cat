output:
  answer: 'El Modernisme català va néixer a finals del segle XIX com una reacció contra
    la industrialització. Aquesta nova època buscava connectar l''art amb la natura
    i la tradició popular, tot donant valor a la identitat catalana. Era un temps
    de gran esplendor cultural i arquitectònic a Barcelona.


    Dos trets clau són les formes orgàniques i l''ús de colors vius. Imagina les façanes
    de les cases com si fossin coses naturals: corbes suaus que recorden onades del
    mar o fulles de les plantes, sense angles durs ni línies rectes avorrides. Un
    exemple perfecte és la Casa Batlló, que sembla una criatura viva. A més, els artistes
    utilitzaven vitralls amb colors intensos i materials com el mosaic per crear efectes
    lluminosos màgics. L''objectiu era que l''art envoltés les persones i les fes
    sentir part d''un món més poètic i proper a la natura, allunyant-se de la fredor
    de les fàbriques.'
