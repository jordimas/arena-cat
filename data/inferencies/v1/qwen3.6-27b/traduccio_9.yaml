output:
  answer: 'Quan arriba la nit, la nena pliega la roba sobre la cadira, se posa el
    seu pijama preferit i s’acosta al llit amb l’os de peluix que ja té una oreja
    torçada. La mare deixa la porta entreoberta perquè hi entri un raig de llum del
    passadís, i la casa comença a parlar en veu baixa: cruix una fusta, sospira una
    finestra, s’apaga l’últim aixeta.


    Des de l’habitació es veu el cel ple d’estrelles. Una d’elles, la més petita,
    li canta una nana en veu molt suau, tan suau que només l’hi senten els qui ja
    estan a punt de somiar.'
