output:
  answer: 'Hola a tothom! Avui us vull explicar una tradició única de Catalunya: els
    castells. Són torres humanes impressionants que demostren la força del treball
    en equip. Imagina-vos una base massissa, anomenada pinya, on la gent s''abraça
    fort per sostenir el pes. Sobre aquesta base, els castellers pugen formant el
    tronc, l''estructura principal. Al final, un nen o nena molt lleugera, l''enxaneta,
    puja al capdamunt i aixeca un braç per completar la torre. Aquest espectacle no
    és només acrobàcia; és cultura viva. La nostra consigna és «força, equilibri,
    valor i seny». La força física és necessària, però també cal equilibri per no
    caure, valor per superar la por d''altura i, sobretot, seny, és a dir, bon sentit
    i prudència. Sense aquests quatre pilars, el castell no es pot aixecar. És una
    metàfora perfecta de la nostra societat: tots junts, respectant-nos i ajudant-nos,
    aconseguim coses impossibles si ho fem sols. Us convido a veure''ls en acció,
    és una experiència que us deixarà sense paraules. Gràcies per escoltar-me i gaudiu
    de la demostració que veureu ara mateix.'
