configuracio_global:
  seed: 42
  backend_preferit: "transformers"
  dir_prompts: "data/prompts/v1"
  dir_sortida: "data/inferencies/v1"

parametres_generacio:
  temperature: 0.7
  top_p: 0.9
  max_new_tokens: 1024
  min_token_len: 25
  # System prompt idèntic en intenció per a tots
  system_prompt: "Ets un assistent d'intel·ligència artificial útil, precís i que respon exclusivament en llengua catalana. Contesta només amb el que es demana sense cap explicació ni text addicional. Contesta sempre en text pla, sense format Markdown o HTML ni elements com ara taules."

models:
  # 1. Qwen 3.8 27B
  - id: "qwen3.8-27b"
    model_name: "Qwen/Qwen3.8-27B"
    revision: "main"
    torch_dtype: "bfloat16"
    device_map: "auto"
    quantization: "none"
    model_class: "auto_multimodal_lm"
    es_reasoning_model: true

  # 2. Mistral Small 3.2 24B Instruct
  - id: "mistral-small-3.2-24b-instruct-2506"
    model_name: "mistralai/Mistral-Small-3.2-24B-Instruct-2506"
    revision: "main"
    torch_dtype: "bfloat16"
    device_map: "auto"
    quantization: "none"
    backend: "mistral_common"
    es_reasoning_model: false

  # 3. Gemma 4 26B A4B Instruct
  - id: "gemma-4-26b-a4b-it"
    model_name: "google/gemma-4-26B-A4B-it"
    revision: "main"
    torch_dtype: "bfloat16"
    device_map: "auto"
    quantization: "none"
    model_class: "auto_multimodal_lm"
    es_reasoning_model: true
